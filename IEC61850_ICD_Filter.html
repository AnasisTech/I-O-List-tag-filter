<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEC 61850 ICD Tag Filter</title>
<!--
  IEC 61850 ICD Tag Filter — 單一 HTML、完全離線、無外部相依。
  模組（皆在本檔 <script> 內）：
    I18N      : 中文 / English 語系字典與 t()
    Util      : 共用小工具
    Excel     : .xlsx (ZIP + OOXML) 與 .xls (OLE2/CFB + BIFF8) 讀取器（原生實作，無第三方套件）
    SCL       : IEC 61850-6 SCL 解析，建立實例化資料模型（IED/LD/LN/DO/SDO/DA/BDA + FC）
    Matcher   : Excel 路徑 → 依 ICD 資料模型做結構化解析比對
    Engine    : Mark-and-Sweep 白名單篩選、ReportControl/DataSet 處理、型別精簡/複製、輸出 ICD
    Validator : 結構/參照驗證（非 XSD 驗證）
    UI        : 虛擬化樹狀圖、表格、統計、匯出
-->
<style>
:root{--bg:#f3f4f6;--panel:#fff;--bd:#d3d7de;--tx:#1d2330;--mut:#667085;--acc:#1f5fbf;
--keep:#0f7a35;--keepbg:#e3f3e8;--dep:#8a6400;--depbg:#fff3c4;--rem:#8d939c;--err:#c5221f;--errbg:#fde7e5;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 "Segoe UI","Microsoft JhengHei",Arial,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
header{background:#1d2330;color:#fff;padding:7px 14px;display:flex;align-items:center;gap:14px;flex:none}
header h1{font-size:15px;margin:0;font-weight:600}
header .sub{color:#aeb6c4;font-size:12px}
header .lang{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#aeb6c4}
header select{font:inherit;padding:2px 4px;border-radius:3px;border:1px solid #556;background:#2a3244;color:#fff}
.layout{flex:1;display:flex;min-height:0}
aside{width:380px;min-width:320px;overflow:auto;border-right:1px solid var(--bd);background:var(--panel);padding:10px}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
fieldset{border:1px solid var(--bd);border-radius:4px;margin:0 0 10px;padding:6px 10px 8px}
legend{font-weight:600;padding:0 4px}
.frow{display:flex;align-items:center;gap:6px;margin:4px 0}
.frow > .lb{width:100px;flex:none;color:var(--mut)}
.frow select,.frow input[type=text],.frow input[type=number]{flex:1;min-width:0}
select,input[type=text],input[type=number],input[type=search]{font:inherit;padding:3px 5px;border:1px solid var(--bd);border-radius:3px;background:#fff}
label.chk{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
label.chk input{margin-top:3px}
button{font:inherit;padding:4px 10px;border:1px solid var(--bd);border-radius:3px;background:#fff;cursor:pointer}
button:hover:not(:disabled){background:#eef2f8}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover:not(:disabled){background:#174c9b}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12px;color:var(--mut);margin-top:3px;word-break:break-all}
.status.ok{color:var(--keep)}.status.err{color:var(--err)}.status.warn{color:var(--dep)}
.hint{font-size:11.5px;color:var(--mut)}
.preview{font:12px Consolas,monospace;background:#f7f8fa;border:1px solid var(--bd);border-radius:3px;max-height:110px;overflow:auto;padding:3px 6px;margin-top:4px;white-space:pre}
.rcblist{border:1px solid var(--bd);border-radius:3px;max-height:170px;overflow:auto;padding:2px 6px;margin:4px 0;font-size:12px;background:#fafbfc}
.rcblist label{display:flex;gap:5px;align-items:flex-start;margin:2px 0}
.rcblist label input{margin-top:2px}
.rcblist .rk{font-weight:600}
.rcbwarn{font-size:11.5px;color:var(--dep);margin:2px 0 4px}
table.stats{width:100%;border-collapse:collapse;font-size:12.5px}
table.stats td{padding:2px 4px;border-bottom:1px solid #eef0f3}
table.stats td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.stats tr.sec td{font-weight:600;color:var(--mut);padding-top:7px;border-bottom:1px solid var(--bd)}
.c-keep{color:var(--keep)}.c-dep{color:var(--dep)}.c-rem{color:var(--rem)}.c-err{color:var(--err)}
.btncol{display:flex;flex-direction:column;gap:6px}
.dlmsg{font-size:12px;margin-top:4px}
.tabs{display:flex;border-bottom:1px solid var(--bd);background:#f7f8fa;flex:none}
.tabs button{border:none;border-right:1px solid var(--bd);border-radius:0;background:transparent;padding:7px 14px}
.tabs button.on{background:var(--panel);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#e4e7ec;font-size:11px;margin-left:4px;text-align:center}
.tabs .cnt.e{background:var(--errbg);color:var(--err)}
.pane{flex:1;display:none;flex-direction:column;min-height:0}
.pane.on{display:flex}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);flex:none}
.toolbar input[type=search]{width:260px}
.legend{display:flex;gap:10px;font-size:12px;margin-left:auto}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.lg-keep::before{background:var(--keep)}.lg-dep::before{background:#e0b400}.lg-rem::before{background:#c4c8cf}.lg-err::before{background:var(--err)}
.vlist{flex:1;overflow:auto;position:relative;min-height:0}
.vinner{position:relative}
.vrow{position:absolute;left:0;right:0;height:22px;white-space:nowrap;display:flex;align-items:center;padding-right:8px}
.tree .vrow{cursor:default}
.tree .vrow:hover{background:#f1f4f9}
.tree .vrow.sel{background:#dde8fb}
.caret{display:inline-block;width:16px;text-align:center;color:#555;cursor:pointer;flex:none;user-select:none}
.kind{font-size:10.5px;color:#fff;background:#8792a2;border-radius:3px;padding:0 4px;margin-right:5px;flex:none}
.k-IED{background:#3b4a63}.k-LD{background:#566c8f}.k-LN{background:#3f7cac}.k-FC{background:#7a5ea8}.k-DO{background:#2f8f83}.k-SDO{background:#3f9f93}.k-DA{background:#7d8a3a}.k-BDA{background:#99a35a}
.nm{flex:none}
.meta{color:var(--mut);font-size:11.5px;margin-left:8px;overflow:hidden;text-overflow:ellipsis}
.cnts{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;padding-left:10px;flex:none}
.s-keep .nm{color:var(--keep);font-weight:600}
.s-dep .nm{color:var(--dep);font-weight:600}
.s-rem .nm{color:var(--rem);text-decoration:line-through}
.s-err .nm{color:var(--err);font-weight:600}
.s-keep.leaf{background:var(--keepbg)}.s-dep.leaf{background:var(--depbg)}.s-err.leaf{background:var(--errbg)}
.tree .vrow.leaf.sel{background:#dde8fb}
.details{flex:none;height:150px;overflow:auto;border-top:1px solid var(--bd);padding:6px 10px;font-size:12.5px;background:#fafbfc}
.details code{font:12px Consolas,monospace;background:#eef0f4;padding:0 3px;border-radius:2px}
.thead{display:flex;font-weight:600;background:#f2f4f7;border-bottom:1px solid var(--bd);flex:none;padding-right:14px}
.thead div,.tbl .vrow div{padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .vrow{border-bottom:1px solid #f0f1f4}
.tbl .vrow:hover{background:#f6f8fb}
.badge{display:inline-block;padding:0 6px;border-radius:3px;font-size:11.5px;font-weight:600}
.b-matched{background:var(--keepbg);color:var(--keep)}.b-ambiguous{background:var(--depbg);color:var(--dep)}
.b-unmatched,.b-invalid,.b-error{background:var(--errbg);color:var(--err)}.b-duplicate,.b-warning{background:#eceef2;color:#555}
.b-new{background:var(--errbg);color:var(--err)}.b-pre{background:#eceef2;color:#555}
.empty{padding:30px;color:var(--mut);text-align:center}
.doc{overflow:auto;padding:14px 22px;max-width:1000px;line-height:1.6}
.doc h2{font-size:16px;border-bottom:1px solid var(--bd);padding-bottom:3px;margin-top:22px}
.doc code{font:12px Consolas,monospace;background:#eef0f4;padding:0 3px;border-radius:2px}
.doc table{border-collapse:collapse;font-size:12.5px}.doc td,.doc th{border:1px solid var(--bd);padding:3px 7px;text-align:left;vertical-align:top}
.warnbox{border:1px solid #e5c55a;background:#fffbea;padding:6px 10px;border-radius:4px;font-size:12px;margin:6px 0}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;font-size:15px;z-index:10}
.busy.on{display:flex}
</style>
</head>
<body>
<header>
  <h1>IEC 61850 ICD Tag Filter</h1>
  <span class="sub" data-i18n="app.sub"></span>
  <span class="lang">🌐 <select id="selLang"><option value="zh">中文</option><option value="en">English</option></select></span>
</header>
<div class="layout">
<aside>
  <fieldset>
    <legend data-i18n="f.icd"></legend>
    <input type="file" id="fIcd" accept=".icd,.cid,.iid,.scd,.xml">
    <div class="status" id="icdStatus"></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="f.xl"></legend>
    <input type="file" id="fXl" accept=".xlsx,.xls">
    <div class="status" id="xlStatus"></div>
    <div class="frow"><span class="lb" data-i18n="lb.sheet"></span><select id="selSheet" disabled></select></div>
    <div class="frow"><span class="lb" data-i18n="lb.col"></span><select id="selCol" disabled></select></div>
    <div class="frow"><span class="lb" data-i18n="lb.start"></span><input type="number" id="inStart" min="1" value="2" disabled></div>
    <div class="frow"><span class="lb" data-i18n="lb.prefix"></span><input type="text" id="inPrefix" data-i18n-ph="ph.prefix" disabled></div>
    <div class="preview" id="xlPreview"></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="f.opt"></legend>
    <div class="frow"><span class="lb" data-i18n="lb.gran"></span>
      <select id="optGran">
        <option value="da" selected data-i18n="gran.da"></option>
        <option value="leaf" data-i18n="gran.leaf"></option>
        <option value="dofc" data-i18n="gran.dofc"></option>
        <option value="do" data-i18n="gran.do"></option>
      </select></div>
    <div class="frow"><span class="lb">ReportControl</span>
      <select id="optRcb">
        <option value="auto" selected data-i18n="rcb.auto"></option>
        <option value="keepAll" data-i18n="rcb.keepAll"></option>
        <option value="none" data-i18n="rcb.none"></option>
        <option value="custom" data-i18n="rcb.custom"></option>
      </select></div>
    <div class="rcbwarn" id="rcbWarn"></div>
    <div class="rcblist" id="rcbList"></div>
    <div class="frow"><span class="lb" data-i18n="lb.amb"></span>
      <select id="optAmb">
        <option value="keep" selected data-i18n="amb.keep"></option>
        <option value="skip" data-i18n="amb.skip"></option>
      </select></div>
    <label class="chk"><input type="checkbox" id="optCtl" checked><span data-i18n="opt.ctl"></span></label>
    <label class="chk"><input type="checkbox" id="optQt"><span data-i18n="opt.qt"></span></label>
    <label class="chk"><input type="checkbox" id="optSgcb"><span data-i18n="opt.sgcb"></span></label>
    <label class="chk"><input type="checkbox" id="optLd" checked><span data-i18n="opt.ld"></span></label>
    <label class="chk"><input type="checkbox" id="optTypes" checked><span data-i18n="opt.types"></span></label>
    <label class="chk"><input type="checkbox" id="optReuse" checked><span data-i18n="opt.reuse"></span></label>
    <label class="chk"><input type="checkbox" id="optHist"><span data-i18n="opt.hist"></span></label>
    <button id="btnRun" class="primary" disabled style="margin-top:6px" data-i18n="btn.run"></button>
  </fieldset>

  <fieldset>
    <legend data-i18n="f.stats"></legend>
    <table class="stats" id="statsTbl"></table>
  </fieldset>

  <fieldset>
    <legend data-i18n="f.elipse"></legend>
    <div class="hint" data-i18n="el.hint"></div>
        <div class="frow"><span class="lb" data-i18n="el.drv"></span><input type="text" id="inElDrv" value="IEC61850"></div>
    <div class="frow"><span class="lb" data-i18n="el.prj"></span><input type="text" id="inElPrj" placeholder="C:\...\project.prj"></div>
    <div class="hint" data-i18n="el.prjHint"></div>
    <div class="frow"><span class="lb" data-i18n="el.mode"></span>
      <select id="selElMode">
        <option value="excel" selected data-i18n="el.modeExcel"></option>
        <option value="filtered" data-i18n="el.modeFiltered"></option>
      </select></div>
    <div class="frow"><span class="lb">DataSets</span>
      <select id="selElDs">
        <option value="none" selected data-i18n="el.dsNone"></option>
        <option value="wl" data-i18n="el.dsWl"></option>
        <option value="all" data-i18n="el.dsAll"></option>
      </select></div>
    <label class="chk"><input type="checkbox" id="optElQt"><span data-i18n="el.qt"></span></label>
    <details style="margin:4px 0"><summary class="hint" data-i18n="el.tpl"></summary>
    <input type="file" id="fElTpl" accept=".csv">
    <div class="status" id="elTplStatus"></div></details>
    <div class="btncol"><button id="btnElipse" class="primary" disabled data-i18n="btn.elipse"></button></div>
    <div class="dlmsg" id="elMsg"></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="f.export"></legend>
    <div class="btncol">
      <button id="btnDl" class="primary" disabled>Download Filtered ICD</button>
      <div class="dlmsg" id="dlMsg"></div>
      <button id="btnCsvMatch" disabled data-i18n="btn.csvMatch"></button>
      <button id="btnCsvTags" disabled data-i18n="btn.csvTags"></button>
      <button id="btnCsvVal" disabled data-i18n="btn.csvVal"></button>
    </div>
    <div class="warnbox" data-i18n-html="warn.scope"></div>
  </fieldset>
</aside>

<main>
  <div class="tabs" id="tabs">
    <button data-tab="tree" class="on"><span data-i18n="tab.tree"></span></button>
    <button data-tab="match"><span data-i18n="tab.match"></span><span class="cnt" id="cntMatch">0</span></button>
    <button data-tab="dep"><span data-i18n="tab.dep"></span><span class="cnt" id="cntDep">0</span></button>
    <button data-tab="val"><span data-i18n="tab.val"></span><span class="cnt" id="cntVal">0</span></button>
    <button data-tab="help"><span data-i18n="tab.help"></span></button>
  </div>

  <section class="pane on" id="pane-tree">
    <div class="toolbar">
      <input type="search" id="treeSearch" data-i18n-ph="ph.treeSearch">
      <select id="treeFilter">
        <option value="all" data-i18n="tf.all"></option>
        <option value="kept" data-i18n="tf.kept"></option>
        <option value="excel" data-i18n="tf.excel"></option>
        <option value="dep" data-i18n="tf.dep"></option>
        <option value="rem" data-i18n="tf.rem"></option>
        <option value="err" data-i18n="tf.err"></option>
      </select>
      <button id="btnExpLN" data-i18n="btn.expLN"></button>
      <button id="btnCollapse" data-i18n="btn.collapse"></button>
      <span class="legend"><span class="lg-keep" data-i18n="lg.keep"></span><span class="lg-dep" data-i18n="lg.dep"></span><span class="lg-rem" data-i18n="lg.rem"></span><span class="lg-err" data-i18n="lg.err"></span></span>
    </div>
    <div class="vlist tree" id="treeView"></div>
    <div class="details" id="details"></div>
  </section>

  <section class="pane" id="pane-match">
    <div class="toolbar">
      <select id="matchFilter">
        <option value="all" data-i18n="mf.all"></option>
        <option value="matched" data-i18n="mf.matched"></option>
        <option value="unmatched" data-i18n="mf.unmatched"></option>
        <option value="ambiguous" data-i18n="mf.ambiguous"></option>
        <option value="duplicate" data-i18n="mf.duplicate"></option>
      </select>
      <input type="search" id="matchSearch" data-i18n-ph="ph.search">
      <span class="hint" data-i18n="match.hint"></span>
    </div>
    <div class="thead"><div style="width:60px" data-i18n="mh.row"></div><div style="width:300px" data-i18n="mh.content"></div><div style="width:90px" data-i18n="mh.status"></div><div style="width:70px" data-i18n="mh.leaf"></div><div style="flex:1" data-i18n="mh.msg"></div></div>
    <div class="vlist tbl" id="matchView"></div>
  </section>

  <section class="pane" id="pane-dep">
    <div class="toolbar"><span class="hint" data-i18n="dep.hint"></span></div>
    <div id="depSummary" style="padding:6px 10px;flex:none;max-height:180px;overflow:auto"></div>
    <div class="thead"><div style="width:420px" data-i18n="dh.tag"></div><div style="flex:1" data-i18n="dh.reason"></div></div>
    <div class="vlist tbl" id="depView"></div>
  </section>

  <section class="pane" id="pane-val">
    <div class="toolbar"><span class="hint" data-i18n="val.hint"></span></div>
    <div class="thead"><div style="width:80px" data-i18n="vh.level"></div><div style="width:90px" data-i18n="vh.src"></div><div style="width:120px" data-i18n="vh.code"></div><div style="flex:1" data-i18n="vh.msg"></div></div>
    <div class="vlist tbl" id="valView"></div>
  </section>

  <section class="pane" id="pane-help"><div class="doc" id="helpDoc"></div></section>
</main>
</div>
<div class="busy" id="busy" data-i18n="busy"></div>

<script>
(function(){
'use strict';

/* =====================================================================
 * I18N — 語系字典：key: [中文, English]；參數以 {name} 表示
 * ===================================================================== */
const DICT = {
  'app.sub': ['Whitelist-based Subtractive Filtering · 完全離線 · 不修改原始 ICD · v1.2', 'Whitelist-based Subtractive Filtering · Fully offline · Original ICD never modified · v1.2'],
  'busy': ['處理中…', 'Processing…'],
  'notLoaded': ['尚未載入', 'Not loaded'],
  'f.icd': ['1. ICD 檔案', '1. ICD file'],
  'f.xl': ['2. Excel I/O List（白名單）', '2. Excel I/O list (whitelist)'],
  'lb.sheet': ['Worksheet', 'Worksheet'],
  'lb.col': ['Tag 欄位', 'Tag column'],
  'lb.start': ['資料起始列', 'First data row'],
  'lb.prefix': ['路徑前綴', 'Path prefix'],
  'ph.prefix': ['選填，例如 LD0/', 'Optional, e.g. LD0/'],
  'f.opt': ['3. 篩選選項', '3. Filter options'],
  'lb.gran': ['刪減粒度', 'Granularity'],
  'gran.da': ['DA（保留完整 DA 結構，建議）', 'DA (keep complete DA structures, recommended)'],
  'gran.leaf': ['Leaf（精細至 BDA）', 'Leaf (down to BDA)'],
  'gran.dofc': ['DO + 同 FC', 'DO + same FC'],
  'gran.do': ['完整 DO（所有 FC）', 'Complete DO (all FCs)'],
  'rcb.auto': ['保留含白名單資料的 Report', 'Keep Reports containing whitelisted data'],
  'rcb.keepAll': ['保留全部 Report 與 DataSet', 'Keep all Reports and DataSets'],
  'rcb.none': ['移除全部 Report（Elipse 改用 polling）', 'Remove all Reports (Elipse polls only)'],
  'rcb.custom': ['自訂：勾選要保留的 Report', 'Custom: tick the Reports to keep'],
  'rcb.empty': ['此 ICD 沒有 ReportControl', 'This ICD has no ReportControl'],
  'rcb.wl': ['含白名單', 'has whitelisted data'],
  'rcb.noWl': ['無白名單', 'no whitelisted data'],
  'rcb.warn': ['⚠ 已移除 {n} 個 Report：Elipse 無法透過它們接收資料，只能 polling。事件可能延遲或漏失，且失去 IED 端事件時間戳與斷線緩衝 (BRCB)。', '⚠ {n} Report(s) removed: Elipse cannot receive data through them and must poll. Events may be delayed or missed; IED event timestamps and buffering during disconnection (BRCB) are lost.'],
  'lb.amb': ['歧義路徑', 'Ambiguous paths'],
  'amb.keep': ['保留所有候選（黃色）', 'Keep all candidates (yellow)'],
  'amb.skip': ['不保留（僅警告）', 'Do not keep (warning only)'],
  'opt.ctl': ['控制完整性：保留 CO 時一併保留 Oper/SBOw/Cancel 全結構與 ctlModel', 'Control completeness: when CO is kept, also keep full Oper/SBOw/Cancel and ctlModel'],
  'opt.qt': ['保留 ST/MX 值的 q、t 兄弟屬性', 'Keep q and t siblings of ST/MX values'],
  'opt.sgcb': ['移除 SettingControl（Elipse LLN0 的 SP 節點；將無法從 Elipse 切換/讀取定值群組）', 'Remove SettingControl (the SP node under LLN0 in Elipse; setting groups can no longer be switched/read from Elipse)'],
  'w.sgcb': ['已移除 {n} 個 SettingControl（{list}）：Elipse 不會建立 SP 節點，無法切換定值群組；IED 本身不受影響。', 'Removed {n} SettingControl(s) ({list}): Elipse will not create SP nodes and cannot switch setting groups; the IED itself is unaffected.'],
  's.sgcb': ['SettingControl（前 → 後）', 'SettingControl (before → after)'],

    if (u8[0] === 0xD0 && u8[1] === 0xCF) return parseXls(buf);
    throw new Error(t('xe.unknown'));
  }
  return {open};
})();

/* =====================================================================
 * SCL — IEC 61850-6 資料模型解析與實例化
 * ===================================================================== */
const SCL = (() => {
  function decode(buf){
    const u8 = new Uint8Array(buf);
    if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    const head = new TextDecoder('latin1').decode(u8.subarray(0, 300));
    const m = head.match(/<\?xml[^>]*encoding\s*=\s*["']([^"']+)["']/i);
    try { return new TextDecoder(m ? m[1].trim().toLowerCase() : 'utf-8').decode(u8); }
    catch (e) { return new TextDecoder('utf-8').decode(u8); }
  }

  /** 建立模型。text 必須保留，輸出時會重新解析同一份文字並以元素序號對應。 */
  function build(text){
    const doc = parseXml(text);
    const pe = doc.getElementsByTagName('parsererror');
    if (pe.length) throw new Error(t('x.xml') + pe[0].textContent.replace(/\s+/g, ' ').slice(0, 300));
    const root = doc.documentElement;
    if (root.localName !== 'SCL') throw new Error(t('x.root'));
    const ns = root.namespaceURI;
    const issues = []; const seen = new Set();
    const issue = (level, code, msg) => { const k = code + '|' + msg; if (seen.has(k)) return; seen.add(k); issues.push({level, code, msg}); };
    if (ns !== SCL_NS) issue('warning', 'NS', t('x.ns', {ns: ns || t('x.none'), std: SCL_NS}));

    const all = doc.getElementsByTagName('*'); const elIndex = new Map();
    for (let i = 0; i < all.length; i++) elIndex.set(all[i], i);

    /* ---- DataTypeTemplates ---- */
    const T = {ln: new Map(), do: new Map(), da: new Map(), en: new Map()};
    const KIND = {LNodeType: 'ln', DOType: 'do', DAType: 'da', EnumType: 'en'};
    const dtt = sclKid(root, ns, 'DataTypeTemplates');
    const allTypeIds = new Set();
    if (dtt) for (const e of sclKids(dtt, ns)) {
      const k = KIND[e.localName]; if (!k) continue;
      const id = e.getAttribute('id') || '';
      allTypeIds.add(id);
      if (T[k].has(id)) { issue('error', 'DUP_TYPE', t('x.dupType', {tag: e.localName, id})); continue; }
      const ty = {kind: k, id, el: e, children: []};
      if (k === 'ln') { ty.lnClass = e.getAttribute('lnClass'); for (const c of sclKids(e, ns, 'DO')) ty.children.push({tag: 'DO', name: c.getAttribute('name'), type: c.getAttribute('type'), el: c}); }
      else if (k === 'do') {
        ty.cdc = e.getAttribute('cdc');
        for (const c of sclKids(e, ns)) {
          if (c.localName === 'SDO') ty.children.push({tag: 'SDO', name: c.getAttribute('name'), type: c.getAttribute('type'), el: c});
          else if (c.localName === 'DA') ty.children.push({tag: 'DA', name: c.getAttribute('name'), fc: c.getAttribute('fc'), bType: c.getAttribute('bType'), type: c.getAttribute('type'), count: c.getAttribute('count'), el: c});
        }
      } else if (k === 'da') { for (const c of sclKids(e, ns, 'BDA')) ty.children.push({tag: 'BDA', name: c.getAttribute('name'), bType: c.getAttribute('bType'), type: c.getAttribute('type'), count: c.getAttribute('count'), el: c}); }
      T[k].set(id, ty);
    }
    if (!dtt) issue('warning', 'NO_DTT', t('x.noDtt'));

    /* ---- 實例化模型 ---- */
    const nodes = [], leaves = [], ieds = [], lds = [], lns = [], lnIndex = new Map(), fcsAll = new Set();
    const mk = (kind, name, parent, extra) => {
      const n = Object.assign({id: nodes.length, kind, name, parent, children: [], leafStart: leaves.length, leafEnd: leaves.length}, extra);
      nodes.push(n); if (parent) parent.children.push(n); return n;
    };
    const asLeaf = n => { n.leaf = true; n.li = leaves.length; n.leafStart = leaves.length; leaves.push(n); n.leafEnd = leaves.length; };

    function expandDA(parent, def, kind, fc, stack){
      const n = mk(kind, def.name, parent, {fc, bType: def.bType, typeId: def.type, count: def.count});
      if (fc) fcsAll.add(fc);
      if (kind === 'DA') parent.fcs.add(fc);
      if (def.bType === 'Struct') {
        const ty = T.da.get(def.type);
        if (!ty) { n.err = t('e.noDAT', {id: def.type}); issue('error', 'REF_DAT', n.err); asLeaf(n); }
        else if (stack.includes(def.type)) { n.err = t('e.cycDA', {id: def.type}); issue('error', 'CYCLE', n.err); asLeaf(n); }
        else if (!ty.children.length) { n.err = t('e.emptyDAT', {id: def.type}); asLeaf(n); }
        else { stack.push(def.type); for (const c of ty.children) expandDA(n, c, 'BDA', fc, stack); stack.pop(); n.leafEnd = leaves.length; }
      } else {
        if (def.bType === 'Enum' && !T.en.has(def.type)) { n.err = t('e.noEnum', {id: def.type}); issue('error', 'REF_ENUM', n.err); }
        asLeaf(n);
      }
      return n;
    }
    function expandDO(parent, def, kind, stack){
      const n = mk(kind, def.name, parent, {typeId: def.type, fcs: new Set()});
      const ty = T.do.get(def.type);
      if (!ty) { n.err = t('e.noDOT', {id: def.type}); issue('error', 'REF_DOT', n.err); }
      else if (stack.includes(def.type)) { n.err = t('e.cycDO', {id: def.type}); issue('error', 'CYCLE', n.err); }
      else {
        stack.push(def.type);
        for (const c of ty.children) { if (c.tag === 'SDO') expandDO(n, c, 'SDO', stack); else expandDA(n, c, 'DA', c.fc, stack); }
        stack.pop();
      }
      n.cdc = ty ? ty.cdc : null;
      n.leafEnd = leaves.length;
      n.fcs.forEach(f => parent.fcs.add(f));
      return n;
    }

    const datasets = [], controls = [], extRefs = [], lnodes = [], comms = [];
    for (const iedEl of sclKids(root, ns, 'IED')) {
      const iedName = iedEl.getAttribute('name') || '';
      const ied = mk('IED', iedName, null, {el: iedEl, aps: []}); ieds.push(ied);
      for (const ap of sclKids(iedEl, ns, 'AccessPoint')) {
        const apName = ap.getAttribute('name') || '';
        const srv = sclKid(ap, ns, 'Server');
        ied.aps.push({name: apName, el: ap, server: srv});
        if (!srv) continue;
        for (const ldEl of sclKids(srv, ns, 'LDevice')) {
          const inst = ldEl.getAttribute('inst') || '';
          const ldName = ldEl.getAttribute('ldName') || (iedName + inst);
          const ld = mk('LD', ldName, ied, {el: ldEl, inst, ldName, apName, iedName});
          lds.push(ld);
          for (const lnEl of [...sclKids(ldEl, ns, 'LN0'), ...sclKids(ldEl, ns, 'LN')]) {
            const prefix = lnEl.getAttribute('prefix') || '', lnClass = lnEl.getAttribute('lnClass') || '', lnInst = lnEl.getAttribute('inst') || '';
            const name = prefix + lnClass + lnInst; const lnType = lnEl.getAttribute('lnType');
            const ln = mk('LN', name, ld, {el: lnEl, prefix, lnClass, lnInst, isLN0: lnEl.localName === 'LN0', typeId: lnType, fcs: new Set()});
            lns.push(ln);
            if (!lnIndex.has(name)) lnIndex.set(name, []); lnIndex.get(name).push(ln);
            const lt = T.ln.get(lnType);
            if (!lt) { ln.err = t('e.noLNT', {id: lnType}); issue('error', 'REF_LNT', t('x.lnErr', {p: ldName + '/' + name, e: ln.err})); }
            else {
              if (lt.lnClass && lt.lnClass !== lnClass) issue('warning', 'LNCLASS', t('x.lnClass', {p: ldName + '/' + name, a: lnClass, t: lnType, b: lt.lnClass}));
              for (const d of lt.children) expandDO(ln, d, 'DO', [lnType]);
            }
            ln.leafEnd = leaves.length;
            for (const dsEl of sclKids(lnEl, ns, 'DataSet')) {
              const ds = {name: dsEl.getAttribute('name') || '', el: dsEl, ln, ld, ied, fcdas: [], users: []};
              for (const f of sclKids(dsEl, ns, 'FCDA')) ds.fcdas.push({el: f, ldInst: f.getAttribute('ldInst'), prefix: f.getAttribute('prefix') || '', lnClass: f.getAttribute('lnClass') || '', lnInst: f.getAttribute('lnInst') || '', doName: f.getAttribute('doName') || '', daName: f.getAttribute('daName') || '', fc: f.getAttribute('fc') || ''});
              datasets.push(ds);
            }
            for (const tag of ['ReportControl', 'LogControl', 'GSEControl', 'SampledValueControl', 'SettingControl'])
              for (const c of sclKids(lnEl, ns, tag)) controls.push({tag, name: c.getAttribute('name') || '', datSet: c.getAttribute('datSet'), buffered: c.getAttribute('buffered') === 'true', el: c, ln, ld, ied});
            const inputs = sclKid(lnEl, ns, 'Inputs');
            if (inputs) for (const x of sclKids(inputs, ns, 'ExtRef')) extRefs.push({el: x, ln, ied, iedName: x.getAttribute('iedName'), ldInst: x.getAttribute('ldInst'), prefix: x.getAttribute('prefix') || '', lnClass: x.getAttribute('lnClass') || '', lnInst: x.getAttribute('lnInst') || '', doName: x.getAttribute('doName') || '', daName: x.getAttribute('daName') || ''});
          }
          ld.leafStart = ld.children.length ? ld.children[0].leafStart : leaves.length;
          ld.leafEnd = leaves.length;
        }
      }
      ied.leafStart = ied.children.length ? ied.children[0].leafStart : leaves.length;
      ied.leafEnd = leaves.length;
    }
    for (const ds of datasets) for (const c of controls) if (c.ln === ds.ln && c.datSet === ds.name) ds.users.push(c);
    for (const e of root.getElementsByTagNameNS(ns, 'LNode')) lnodes.push({el: e, iedName: e.getAttribute('iedName'), ldInst: e.getAttribute('ldInst'), prefix: e.getAttribute('prefix') || '', lnClass: e.getAttribute('lnClass') || '', lnInst: e.getAttribute('lnInst') || ''});
    const comm = sclKid(root, ns, 'Communication');
    if (comm) for (const sn of sclKids(comm, ns, 'SubNetwork')) for (const cap of sclKids(sn, ns, 'ConnectedAP')) {
      const c = {el: cap, iedName: cap.getAttribute('iedName'), apName: cap.getAttribute('apName'), blocks: []};
      for (const tag of ['GSE', 'SMV']) for (const g of sclKids(cap, ns, tag)) c.blocks.push({tag, el: g, ldInst: g.getAttribute('ldInst'), cbName: g.getAttribute('cbName')});
      comms.push(c);
    }

    const M = {doc, text, ns, root, T, allTypeIds, nodes, leaves, ieds, lds, lns, lnIndex, fcsAll, datasets, controls, extRefs, lnodes, comms, issues, elIndex};
    M.child = child; M.resolve = (iedName, r) => resolve(M, iedName, r);
    return M;
  }

  function child(n, name){
    if (!n.cmap) { n.cmap = new Map(); for (const c of n.children) n.cmap.set(c.name, c); }
    return n.cmap.get(name);
  }
  /** 解析 FCDA / ExtRef / LNode 型式的參照 → {node, fc} 或 {err} */
  function resolve(M, iedName, r){
    const ied = M.ieds.find(x => x.name === iedName);
    if (!ied) return {err: t('e.noIED', {n: iedName})};
    const ld = ied.children.find(x => x.inst === (r.ldInst || ''));
    if (!ld) return {err: t('e.noLD', {n: r.ldInst})};
    const lnName = (r.prefix || '') + (r.lnClass || '') + (r.lnInst || '');
    const ln = child(ld, lnName);
    if (!ln) return {err: t('e.noLN', {n: lnName, ld: ld.ldName})};
    let node = ln;
    if (r.doName) for (const p of r.doName.split('.')) {
      const c = child(node, p);
      if (!c || (c.kind !== 'DO' && c.kind !== 'SDO')) return {err: t('e.noDO', {n: r.doName, p: ld.ldName + '/' + lnName})};
      node = c;
    }
    if (r.daName) for (const p of r.daName.split('.')) {
      const c = child(node, p);
      if (!c || (c.kind !== 'DA' && c.kind !== 'BDA')) return {err: t('e.noDA', {n: r.daName, p: ld.ldName + '/' + lnName + '.' + r.doName})};
      node = c;
    }
    const fc = r.fc || null;
    if (fc) {
      if ((node.kind === 'DA' || node.kind === 'BDA') && node.fc !== fc) return {err: t('e.fcDA', {p: lnName + '.' + r.doName + '.' + r.daName, a: node.fc, b: fc})};
      if (node.fcs && !node.fcs.has(fc)) return {err: t('e.fcDO', {p: lnName + '.' + r.doName, fc})};
    }
    return {node, fc};
  }

  function pathInfo(n){
    const doPath = [], daPath = []; let ln = null, ld = null, ied = null; const fc = n.fc || null;
    for (let x = n; x; x = x.parent) {
      if (x.kind === 'DA' || x.kind === 'BDA') daPath.unshift(x.name);
      else if (x.kind === 'DO' || x.kind === 'SDO') doPath.unshift(x.name);
      else if (x.kind === 'LN') ln = x; else if (x.kind === 'LD') ld = x; else if (x.kind === 'IED') ied = x;
    }
    return {ied, ld, ln, fc, doPath, daPath};
  }
  function dotPath(n){
    const p = pathInfo(n);
    let s = (p.ld ? p.ld.inst + '/' : '') + (p.ln ? p.ln.name : '');
    const rest = p.doPath.concat(p.daPath); if (rest.length) s += '.' + rest.join('.');
    if (p.fc) s += ' [' + p.fc + ']';
    return s;
  }
  function mmsPath(n){
    const p = pathInfo(n);
    return (p.ld ? p.ld.ldName + '/' : '') + (p.ln ? p.ln.name : '') + (p.fc ? '$' + p.fc : '') + p.doPath.concat(p.daPath).map(x => '$' + x).join('');
  }
  function leafKey(n){
    const p = pathInfo(n);
    return [p.ied && p.ied.name, p.ld && p.ld.inst, p.ln && p.ln.name, p.fc, p.doPath.join('.'), p.daPath.join('.')].join('|');
  }
  return {decode, build, child, pathInfo, dotPath, mmsPath, leafKey};
})();

/* =====================================================================
 * Matcher — Excel 路徑依 ICD 資料模型結構化解析
 * ===================================================================== */
const Matcher = (() => {
  const SPLIT = /[.\/$]/;
  function prefixOK(P, ln){
    const ld = ln.parent, ied = ld.parent;
    const I = ied.name, L = ld.inst, N = ld.ldName, N2 = I + L;
    if (P.length === 0) return true;
    if (P.length === 1) return P[0] === L || P[0] === N || P[0] === N2 || P[0] === I;
    if (P.length === 2) return P[0] === I && (P[1] === L || P[1] === N || P[1] === N2);
    return false;
  }
  function ciChild(n, s){ const ls = s.toLowerCase(); return n.children.find(c => c.name.toLowerCase() === ls); }

  function match(M, s){
    let fcBr = null;
    const mb = s.match(/\[([A-Za-z]{2})\]$/);
    if (mb) { fcBr = mb[1]; s = s.slice(0, -mb[0].length); }
    const toks = s.split(SPLIT);
    if (toks.some(x => x === '')) return {status: 'invalid', msg: t('m.empty'), results: []};
    const fcTokens = new Set([...STD_FC, ...M.fcsAll]);
    const results = []; let best = {depth: -1, msg: ''};
    const fail = (depth, msg) => { if (depth > best.depth) best = {depth, msg}; };

    function walk(node, k, fc, fcUsed){
      if (k === toks.length) {
        if (fc) {
          if ((node.kind === 'DA' || node.kind === 'BDA') && node.fc !== fc) return fail(k, t('m.fcMis', {n: node.name, a: node.fc, b: fc}));
          if (node.fcs && !node.fcs.has(fc)) return fail(k, t('m.noFc', {k: node.kind, n: node.name, fc}));
        }
        results.push({node, fc});
        return;
      }
      const tok = toks[k]; let any = false;
      const c = SCL.child(node, tok);
      if (c) {
        if (fc && (c.kind === 'DA' || c.kind === 'BDA') && c.fc !== fc) fail(k + 1, t('m.fcMis', {n: c.name, a: c.fc, b: fc}));
        else { any = true; walk(c, k + 1, fc, fcUsed); }
      }
      if (!fcUsed && !fc && fcTokens.has(tok)) {
        const ok = node.fcs ? node.fcs.has(tok) : node.fc === tok;
        if (ok) { any = true; walk(node, k + 1, tok, true); }
        else fail(k + 1, t('m.noFc', {k: node.kind, n: node.name, fc: tok}));
      }
      if (!any && !c) {
        const h = ciChild(node, tok);
        fail(k, t('m.notIn', {t: tok, k: node.kind, n: node.name}) + (node.typeId ? t('m.typeOf', {id: node.typeId}) : '') + (h ? t('m.caseHint', {n: h.name}) : ''));
      }
    }

    let lnFound = false;
    for (let i = 0; i < toks.length && i <= 3; i++) {
      const cands = M.lnIndex.get(toks[i]); if (!cands) continue;
      const P = toks.slice(0, i);
      for (const ln of cands) {
        lnFound = true;
        if (!prefixOK(P, ln)) { fail(i, t('m.prefix', {ln: toks[i], p: P.join('/')})); continue; }
        if (ln.err) { fail(i + 1, t('m.lnErr', {n: ln.name, e: ln.err})); continue; }
        walk(ln, i + 1, fcBr, !!fcBr);
      }
    }
    const uniq = new Map(); for (const r of results) uniq.set(r.node.id + '|' + (r.fc || ''), r);
    const res = [...uniq.values()];
    if (!res.length) {
      let msg = best.msg;
      if (!lnFound) {
        msg = t('m.noLN');
        const lower = toks.map(x => x.toLowerCase());
        for (const name of M.lnIndex.keys()) if (lower.includes(name.toLowerCase())) { msg += t('m.lnCase', {n: name}); break; }
      }
      return {status: 'unmatched', msg, results: []};
    }
    if (res.length > 1) return {status: 'ambiguous', msg: t('m.amb', {n: res.length}) + res.slice(0, 6).map(r => SCL.dotPath(r.node) + (r.fc && !r.node.fc ? ' [' + r.fc + ']' : '')).join(t('m.sep')) + (res.length > 6 ? ' …' : ''), results: res};
    return {status: 'matched', msg: '', results: res};
  }
  return {match};
})();

/* =====================================================================
 * Engine — Mark & Sweep 白名單篩選與 ICD 輸出
 * ===================================================================== */
const Engine = (() => {
  const up = (n, kind) => { while (n && n.kind !== kind) n = n.parent; return n; };
  const topDA = n => { while (n && n.kind === 'BDA') n = n.parent; return n && n.kind === 'DA' ? n : null; };
  const rcbKey = c => `${c.ld.inst}/${c.ln.name}.${c.name}`;

  /**
   * opt: {granularity, rcb:'auto'|'keepAll'|'none'|'custom', rcbSel:Set<rcbKey>|null, ambiguous, control, qt,
   *       removeEmptyLD, removeUnusedTypes, reuseIds, history}
   */
  function analyze(M, entries, opt){
    const t0 = performance.now();
    const L = M.leaves, N = L.length;
    const st = new Uint8Array(N);          // 0 移除, 1 Excel 白名單, 2 相依保留
    const reasons = new Map(), src = new Map();
    const addReason = (i, r) => { let s = reasons.get(i); if (!s) { s = new Set(); reasons.set(i, s); } if (s.size < 8) s.add(r); };
    function mark(node, fc, level, why, row){
      for (let i = node.leafStart; i < node.leafEnd; i++) {
        if (fc && L[i].fc !== fc) continue;
        if (level === 1) { st[i] = 1; if (row != null) { let a = src.get(i); if (!a) src.set(i, a = []); if (a.length < 10 && !a.includes(row)) a.push(row); } }
        else { if (st[i] === 0) st[i] = 2; if (why && st[i] === 2) addReason(i, why); }
      }
    }
    const keptSnapshot = () => { const a = []; for (let i = 0; i < N; i++) if (st[i]) a.push(i); return a; };

    /* 1. Excel 白名單 */
    for (const e of entries) if (e.status === 'matched') for (const r of e.results) mark(r.node, r.fc, 1, null, e.row);
    for (const e of entries) if (e.status === 'ambiguous' && opt.ambiguous === 'keep') for (const r of e.results) mark(r.node, r.fc, 2, reason('r.amb', t('r.ambD', {row: e.row, v: e.norm})));
    const wl = st.slice();

    /* 2. q/t 兄弟屬性 */
    if (opt.qt) {
      const seen = new Set();
      for (const i of keptSnapshot()) {
        const d = topDA(L[i]); if (!d || (d.fc !== 'ST' && d.fc !== 'MX') || d.name === 'q' || d.name === 't') continue;
        const k = d.parent.id + d.fc; if (seen.has(k)) continue; seen.add(k);
        for (const nm of ['q', 't']) { const s = SCL.child(d.parent, nm); if (s && s.fc === d.fc) mark(s, null, 2, reason('r.qt', t('r.qtD', {n: nm}))); }
      }
    }
    /* 3. 控制完整性 */
    if (opt.control) {
      const seen = new Set();
      for (const i of keptSnapshot()) {
        if (L[i].fc !== 'CO') continue;
        const d = topDA(L[i]); if (!d) continue; const dobj = d.parent;
        if (seen.has(dobj.id)) continue; seen.add(dobj.id);
        mark(dobj, 'CO', 2, reason('r.ctl', t('r.ctlD')));
        for (const nm of ['ctlModel', 'sboTimeout', 'sboClass', 'operTimeout']) { const s = SCL.child(dobj, nm); if (s) mark(s, null, 2, reason('r.ctl', nm)); }
      }
    }
    /* 4. ReportControl 與 DataSet：
     *    - ReportControl 依選項決定保留（auto：其 DataSet 含白名單資料才保留）
     *    - DataSet 只在被保留的控制區塊使用時保留（GOOSE/SV/Log 使用者一律保留）
     *    - 保留的 DataSet 不刪減成員，成員全部相依保留（Report/DataSet 須與 IED 一致） */
    const dsByKey = new Map(M.datasets.map(ds => [ds.ln.id + '|' + ds.name, ds]));
    const dsRes = new Map(M.datasets.map(ds => [ds, ds.fcdas.map(f => ({f, r: M.resolve(ds.ied.name, f)}))]));
    const hasWl = ds => dsRes.get(ds).some(({r}) => {
      if (!r.node) return false;

  /** 讀取 Elipse 匯出的 CSV 作為範本：表頭、Driver 列與 Driver 層事件列 */
  function parseTemplate(text){
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(x => x.length);
    if (!lines.length || !/^ObjectType,Name,/.test(lines[0])) throw new Error(t('el.badTpl'));
    const header = lines[0].split(',');
    const prefix = [];
    for (let i = 1; i < lines.length; i++) { const tk = tokens(lines[i]); if (tk[0] === 'IOFolder' || tk[0] === 'IOTag') break; prefix.push(tk); }
    const drv = prefix.find(tk => tk[0] === 'IODriver');
    if (!drv) throw new Error(t('el.noDrv'));
    const col = h => header.indexOf(h);
    return {header, prefix, driverName: unq(drv[col('PathName')]), prjPath: unq(drv[col('PathVolume')]), driverDesc: unq(drv[col('DriverName')])};
  }
  function builtin(){
    const lines = BUILTIN_PREFIX;
    return {header: lines[0].split(','), prefix: lines.slice(1).map(tokens), builtin: true};
  }

  const topDA = n => { while (n && n.kind === 'BDA') n = n.parent; return n && n.kind === 'DA' ? n : null; };

  /**
   * opt: {mode:'excel'|'filtered', qt, dataSets:'none'|'wl'|'all', driverName, prjPath, tpl}
   * 回傳 {text, stats, warns}
   */
  function build(M, entries, R, opt){
    const L = M.leaves, N = L.length;
    const sel = new Uint8Array(N);
    const warns = [];
    if (opt.mode === 'filtered' && R) { for (let i = 0; i < N; i++) if (R.st[i]) sel[i] = 1; }
    else for (const e of entries) {
      if (!(e.status === 'matched' || (e.status === 'ambiguous' && opt.ambiguous === 'keep'))) continue;
      for (const r of e.results) for (let i = r.node.leafStart; i < r.node.leafEnd; i++) if (!r.fc || L[i].fc === r.fc) sel[i] = 1;
    }
    if (opt.qt) for (let i = 0; i < N; i++) {
      if (!sel[i]) continue; const d = topDA(L[i]);
      if (!d || (d.fc !== 'ST' && d.fc !== 'MX') || d.name === 'q' || d.name === 't') continue;
      for (const nm of ['q', 't']) { const s = SCL.child(d.parent, nm); if (s && s.fc === d.fc) for (let k = s.leafStart; k < s.leafEnd; k++) sel[k] = 1; }
    }
    /* 控制：CO 下任何被選取的 leaf → 該 DO 產生一個 Operate Tag + <DO>_Stat IOBlock（Elipse 匯入 ICD 時的作法） */
    const coDO = new Set(); const sboDO = [];
    for (let i = 0; i < N; i++) if (sel[i] && L[i].fc === 'CO') { const d = topDA(L[i]); if (d) coDO.add(d.parent); }
    for (const d of coDO) if (SCL.child(d, 'SBOw') || SCL.child(d, 'SBO')) sboDO.push(SCL.dotPath(d));
    if (sboDO.length) warns.push(t('el.wSbo', {n: sboDO.length, ex: sboDO.slice(0, 5).join(', ')}));
    const noOper = [...coDO].filter(d => !SCL.child(d, 'Oper')).map(d => SCL.dotPath(d));
    if (noOper.length) warns.push(t('el.wNoOper', {n: noOper.length, ex: noOper.slice(0, 5).join(', ')}));

    /* subtree 內是否有被選取的 leaf（可限定 FC） */
    const ps = new Int32Array(N + 1); for (let i = 0; i < N; i++) ps[i + 1] = ps[i] + sel[i];
    const has = (n, fc) => { if (!fc) return ps[n.leafEnd] - ps[n.leafStart] > 0; for (let i = n.leafStart; i < n.leafEnd; i++) if (sel[i] && L[i].fc === fc) return true; return false; };

    const tpl = opt.tpl || builtin();
    const H = tpl.header, col = new Map(H.map((h, i) => [h, i]));
    const drv = opt.driverName || 'IEC61850';
    const vol = q(opt.prjPath || '');
    const out = [H.join(',')];
    const counts = {folder: 0, tag: 0, oper: 0, block: 0, arr: 0};
    const emit = (base, o) => {
      const a = new Array(H.length).fill('');
      for (const [k, v] of Object.entries(base)) if (col.has(k)) a[col.get(k)] = v;
      for (const [k, v] of Object.entries(o)) if (col.has(k)) a[col.get(k)] = v;
      out.push(a.join(','));
    };
    const events = (name, isTag) => {
      out.push(pad('IEvents', name + '.ObjectEvents'));
      for (const ev of ['OnStartRunning', 'OnStopRunning'].concat(isTag ? ['OnRead'] : [])) out.push(pad('IEvent', name + '.ObjectEvents.' + ev));
    };
    const pad = (type, name) => { const a = new Array(H.length).fill(''); a[0] = type; a[col.get('Name')] = q(name); return a.join(','); };
    const common = name => ({Name: q(name), PathContainer: q(drv), PathName: q(drv + '.' + name), PathVolume: vol});
    const folder = (name, doc, dev) => { emit(TM.folder, Object.assign(common(name), {DocString: q(doc), ParamDevice: q(dev)})); events(name, false); counts.folder++; };
    const tag = (name, dev, item, leaf) => {
      if (leaf && leaf.count) counts.arr++;
      emit(TM.tag, Object.assign(common(name), {ParamDevice: q(dev), ParamItem: q(item)})); events(name, true); counts.tag++;
    };
    const NODE_DOC = 'IEC61850 Logical Node, FC or Data';

    /* 前置列：Driver 與 Driver 層事件（Driver 名稱 / PRJ 路徑以目前設定覆寫） */
    for (const tk of tpl.prefix) {
      const a = H.map((_, i) => tk[i] || '');
      if (a[0] === 'IODriver') { if (col.has('PathName')) a[col.get('PathName')] = q(drv); if (col.has('PathVolume')) a[col.get('PathVolume')] = vol; }
      out.push(a.join(','));
    }

    /* 依 ICD 順序展開：IED → LD → LN → FC → DO/SDO → DA/BDA */
    function walk(node, fc, name, item, dev){
      for (const c of node.children) {
        if (c.fcs ? !c.fcs.has(fc) : c.fc !== fc) continue;
        if (!has(c, fc)) continue;
        const nm = name + '.' + c.name, it = item + '$' + c.name;
        if (c.leaf) tag(nm, dev, it, c);
        else { folder(nm, NODE_DOC, dev); walk(c, fc, nm, it, dev); }
      }
    }
    function walkCO(node, name, item, dev){
      for (const c of node.children) {
        if (!(c.kind === 'DO' || c.kind === 'SDO') || !c.fcs.has('CO') || !has(c, 'CO')) continue;
        const nm = name + '.' + c.name, it = item + '$' + c.name;
        folder(nm, NODE_DOC, dev);
        if (coDO.has(c)) {
          if (SCL.child(c, 'Oper')) {
            emit(TM.tag, Object.assign(common(nm + '.Operate'), {AllowRead: 'False', DocString: q('Operate'), ParamDevice: q(dev), ParamItem: q(it + '$Oper')}));
            events(nm + '.Operate', true); counts.oper++;
          }
          const bn = nm + '.' + c.name + '_Stat';
          emit(TM.block, Object.assign(common(bn), {ParamDevice: q(dev), ParamItem: q(it)})); events(bn, true); counts.block++;
          emit(TM.el, Object.assign(common(bn + '.Status'), {DocString: q('Status with result code'), Index: '0'})); events(bn + '.Status', false);
          emit(TM.el, Object.assign(common(bn + '.StatusText'), {DocString: q('Status Description'), Index: '1'})); events(bn + '.StatusText', false);
        }
        walkCO(c, nm, it, dev);
      }
    }
    for (const ied of M.ieds) {
      const lds = ied.children.filter(ld => has(ld));
      if (!lds.length) continue;
      folder(ied.name, 'IEC61850 Device', '');
      for (const ld of lds) {
        const dev = ied.name + ':' + ld.ldName, ldn = ied.name + '.' + ld.ldName;
        folder(ldn, 'IEC61850 Logical Device', dev);
        for (const ln of ld.children) {
          if (!has(ln)) continue;
          const lnn = ldn + '.' + ln.name; folder(lnn, NODE_DOC, dev);
          const fcs = []; for (let i = ln.leafStart; i < ln.leafEnd; i++) if (sel[i] && !fcs.includes(L[i].fc)) fcs.push(L[i].fc);
          for (const fc of fcs) {
            const fn = lnn + '.' + fc; folder(fn, NODE_DOC, dev);
            if (fc === 'CO') walkCO(ln, fn, ln.name + '$CO', dev);
            else walk(ln, fc, fn, ln.name + '$' + fc, dev);
          }
        }
        /* DataSets（選用）：與一般 Tag 相同 ParamItem，只是 Elipse 以 DataSet 分類呈現 */
        if (opt.dataSets !== 'none') {
          const dss = M.datasets.filter(ds => ds.ld === ld);
          const plan = [];
          for (const ds of dss) {
            const mem = [];
            for (const f of ds.fcdas) {
              const r = M.resolve(ied.name, f); if (!r.node) continue;
              const lst = []; for (let i = r.node.leafStart; i < r.node.leafEnd; i++) if ((!r.fc || L[i].fc === r.fc) && L[i].fc !== 'CO' && (opt.dataSets === 'all' || sel[i])) lst.push(i);
              if (lst.length) mem.push({f, r, lst});
            }
            if (mem.length) plan.push({ds, mem});
          }
          if (plan.length) {
            const dsr = ldn + '.DataSets'; folder(dsr, 'DataSets', dev);
            for (const {ds, mem} of plan) {
              const key = ds.ln.name + '$' + ds.name, dn = dsr + '.[' + key + ']'; folder(dn, key, dev);
              for (const {f, r, lst} of mem) {
                const base = (f.prefix + f.lnClass + f.lnInst) + '$' + f.fc + '$' + f.doName.split('.').join('$') + (f.daName ? '$' + f.daName.split('.').join('$') : '');
                const mn = dn + '.[' + base + ']';
                if (r.node.leaf) { tag(mn, dev, base, r.node); continue; }
                folder(mn, NODE_DOC, dev);
                const want = new Set(lst);
                const sub = (node, name, item) => {
                  for (const c of node.children) {
                    let any = false; for (let i = c.leafStart; i < c.leafEnd; i++) if (want.has(i)) { any = true; break; }
                    if (!any) continue;
                    if (c.leaf) tag(name + '.' + c.name, dev, item + '$' + c.name, c);
                    else { folder(name + '.' + c.name, NODE_DOC, dev); sub(c, name + '.' + c.name, item + '$' + c.name); }
                  }
                };
                sub(r.node, mn, base);
              }
            }
          }
        }
      }
    }
    if (counts.arr) warns.push(t('el.wArr', {n: counts.arr}));
    const unmatched = entries.filter(e => e.status === 'unmatched' || e.status === 'invalid').length;
    if (unmatched) warns.push(t('el.wUnm', {n: unmatched}));
    return {text: out.join('\r\n') + '\r\n', stats: counts, warns, nSel: ps[N]};
  }
  return {build, parseTemplate, tokens};
})();

/* =====================================================================
 * Validator — SCL 結構與參照檢查（不是 XSD Schema 驗證）
 * ===================================================================== */
const Validator = (() => {
  function validate(M){
    const iss = M.issues.slice(); const seen = new Set(iss.map(x => x.code + '|' + x.msg));
    const push = (level, code, msg) => { const k = code + '|' + msg; if (!seen.has(k)) { seen.add(k); iss.push({level, code, msg}); } };
    const ns = M.ns, T = M.T;
    for (const ty of T.ln.values()) {
      if (!ty.children.length) push('error', 'EMPTY_LNT', t('v.emptyLnt', {id: ty.id}));
      const names = new Set();
      for (const c of ty.children) {
        if (names.has(c.name)) push('error', 'DUP_NAME', t('v.dupDo', {id: ty.id, n: c.name})); names.add(c.name);
        if (!T.do.has(c.type)) push('error', 'REF_DOT', t('v.lntRef', {id: ty.id, n: c.name, t: c.type}));
      }
    }
    const chkDA = (owner, c) => {
      if (c.bType === 'Struct' && !T.da.has(c.type)) push('error', 'REF_DAT', t('v.datRef', {o: owner, n: c.name, t: c.type}));
      if (c.bType === 'Enum' && !T.en.has(c.type)) push('error', 'REF_ENUM', t('v.enumRef', {o: owner, n: c.name, t: c.type}));
    };
    for (const ty of T.do.values()) {
      const names = new Set();
      for (const c of ty.children) {
        if (names.has(c.name)) push('error', 'DUP_NAME', t('v.dupName', {id: ty.id, n: c.name})); names.add(c.name);
        if (c.tag === 'SDO' && !T.do.has(c.type)) push('error', 'REF_DOT', t('v.sdoRef', {id: ty.id, n: c.name, t: c.type}));
        if (c.tag === 'DA') chkDA('DOType "' + ty.id + '"', c);
      }
    }
    for (const ty of T.da.values()) {
      if (!ty.children.length) push('error', 'EMPTY_DAT', t('v.emptyDat', {id: ty.id}));
      for (const c of ty.children) chkDA('DAType "' + ty.id + '"', c);
    }
    for (const ty of T.en.values()) if (!sclKids(ty.el, ns, 'EnumVal').length) push('warning', 'EMPTY_ENUM', t('v.emptyEnum', {id: ty.id}));

    const iedNames = new Set();
    for (const ied of M.ieds) {
      if (iedNames.has(ied.name)) push('error', 'DUP_IED', t('v.dupIed', {n: ied.name})); iedNames.add(ied.name);
      for (const ap of ied.aps) if (ap.server && !sclKids(ap.server, ns, 'LDevice').length) push('error', 'NO_LD', t('v.noLd', {i: ied.name, a: ap.name}));
      const insts = new Set();
      for (const ld of ied.children) {
        if (insts.has(ld.inst)) push('error', 'DUP_LD', t('v.dupLd', {i: ied.name, n: ld.inst})); insts.add(ld.inst);
        const n0 = sclKids(ld.el, ns, 'LN0').length;
        if (n0 !== 1) push('error', 'LN0', t('v.ln0', {ld: ld.ldName, n: n0}));
        const lnNames = new Set();
        for (const ln of ld.children) {
          if (lnNames.has(ln.name)) push('error', 'DUP_LN', t('v.dupLn', {ld: ld.ldName, n: ln.name})); lnNames.add(ln.name);
          if (!ln.err) checkInst(ln.el, ln, `${ld.ldName}/${ln.name}`);
        }
      }
    }
    function checkInst(el, node, where){
      for (const c of sclKids(el, ns)) {
        const tag = c.localName; if (tag !== 'DOI' && tag !== 'SDI' && tag !== 'DAI') continue;
        const nm = c.getAttribute('name'); const ch = SCL.child(node, nm);
        if (!ch) { push('error', 'INST_REF', t('v.inst', {w: where, tag, n: nm})); continue; }
        if (tag !== 'DAI' && !ch.leaf) checkInst(c, ch, where + '.' + nm);
      }
    }
    for (const ds of M.datasets) for (const f of ds.fcdas) { const r = M.resolve(ds.ied.name, f); if (!r.node) push('error', 'FCDA', t('v.fcda', {p: `${ds.ld.ldName}/${ds.ln.name}.${ds.name}`, e: r.err})); }
    const dsNames = new Map(); for (const ds of M.datasets) { const k = ds.ln.id + '|' + ds.name; if (dsNames.has(k)) push('error', 'DUP_DS', t('v.dupDs', {p: `${ds.ld.ldName}/${ds.ln.name}.${ds.name}`})); dsNames.set(k, ds); }
    for (const c of M.controls) if (c.datSet && !dsNames.has(c.ln.id + '|' + c.datSet)) push('error', 'DATSET', t('v.datset', {tag: c.tag, n: c.name, p: `${c.ld.ldName}/${c.ln.name}`, ds: c.datSet}));
    for (const cap of M.comms) {
      const ied = M.ieds.find(i => i.name === cap.iedName);
      if (!ied) continue;
      if (!ied.aps.some(a => a.name === cap.apName)) push('warning', 'CAP', t('v.cap', {p: `${cap.iedName}/${cap.apName}`}));
      for (const b of cap.blocks) {
        const ld = ied.children.find(l => l.inst === b.ldInst);
        const tag = b.tag === 'GSE' ? 'GSEControl' : 'SampledValueControl';
        if (!ld || !M.controls.some(c => c.tag === tag && c.ld === ld && c.ln.isLN0 && c.name === b.cbName)) push('error', 'COMM_CB', t('v.commCb', {tag: b.tag, p: `${cap.iedName} ${b.ldInst}/${b.cbName}`}));
      }
    }
    for (const x of M.lnodes) {
      if (!x.iedName || x.iedName === 'None' || !M.ieds.some(i => i.name === x.iedName)) continue;
      const r = M.resolve(x.iedName, {ldInst: x.ldInst, prefix: x.prefix, lnClass: x.lnClass, lnInst: x.lnInst});
      if (!r.node) push('warning', 'LNODE', t('v.lnode', {e: r.err}));
    }
    return iss;
  }
  return {validate};
})();

/* =====================================================================
 * VList — 虛擬化清單（只渲染可視範圍的列）
 * ===================================================================== */
class VList {
  constructor(el, rowH, render){
    this.el = el; this.rowH = rowH; this.render = render; this.n = 0;
    el.innerHTML = ''; this.inner = document.createElement('div'); this.inner.className = 'vinner'; el.appendChild(this.inner);
    el.addEventListener('scroll', () => this.draw());
    new ResizeObserver(() => this.draw()).observe(el);
  }
  setCount(n, keepScroll){ this.n = n; this.inner.style.height = (n * this.rowH) + 'px'; if (!keepScroll) this.el.scrollTop = 0; this.draw(); }
  draw(){
    const top = this.el.scrollTop, h = this.el.clientHeight || 600;
    const s = Math.max(0, Math.floor(top / this.rowH) - 8), e = Math.min(this.n, Math.ceil((top + h) / this.rowH) + 8);
    let html = ''; for (let i = s; i < e; i++) html += this.render(i, i * this.rowH);
    this.inner.innerHTML = html;
  }
}

/* =====================================================================
 * UI
 * ===================================================================== */
const S = {M: null, icdName: '', icdText: null, wb: null, xlName: '', rows: null, entries: [], R: null, rcbSel: null,
  expanded: new Set(), sel: null, treeRows: [], cntCache: new Map(), matchRows: [], depRows: [], valRows: [], status: {}};
const busy = on => $('#busy').classList.toggle('on', on);
const nextFrame = () => new Promise(r => setTimeout(r, 30));
/** 狀態列：以函式產生訊息，切換語系時可重新產生 */
function setStatus(id, gen, cls){ S.status[id] = {gen, cls}; const el = $(id); el.textContent = gen(); el.className = 'status ' + (cls || ''); }
function getOpt(){
  return {granularity: $('#optGran').value, rcb: $('#optRcb').value, rcbSel: S.rcbSel, ambiguous: $('#optAmb').value,
    control: $('#optCtl').checked, qt: $('#optQt').checked, removeSgcb: $('#optSgcb').checked, removeEmptyLD: $('#optLd').checked,
    removeUnusedTypes: $('#optTypes').checked, reuseIds: $('#optReuse').checked, history: $('#optHist').checked};
}

/* ---- 語系 ---- */
function applyStatic(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  for (const [id, s] of Object.entries(S.status)) { const el = $(id); el.textContent = s.gen(); }
  $('#helpDoc').innerHTML = LANG === 'en' ? HELP_EN : HELP_ZH;
  if (!S.sel) $('#details').innerHTML = `<span class="hint">${esc(t('details.hint'))}</span>`;
}
function setLang(l){
  LANG = l === 'en' ? 'en' : 'zh';
  try { localStorage.setItem('icdfilter.lang', LANG); } catch (e) {}
  $('#selLang').value = LANG;
  applyStatic();
  // 模型、比對與分析訊息都以目前語系產生 → 重新建立（保留展開狀態）
  if (S.icdText) {
    const exp = S.expanded;
    try { loadIcdText(S.icdName, S.icdText, true); S.expanded = exp; } catch (e) {}
  } else renderAll();
}
$('#selLang').addEventListener('change', () => { busy(true); setTimeout(() => { setLang($('#selLang').value); busy(false); }, 30); });

/* ---- 檔案載入 ---- */
$('#fIcd').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  busy(true); await nextFrame();
  try { loadIcdText(f.name, SCL.decode(await f.arrayBuffer())); }
  catch (e) { S.M = null; S.icdText = null; const m = e.message; setStatus('#icdStatus', () => '✖ ' + m, 'err'); renderAll(); }
  busy(false);
});
function loadIcdText(name, text, keepView){
  const M = SCL.build(text);
  S.M = M; S.icdName = name; S.icdText = text; S.sel = null;
  if (!keepView) {
    S.expanded = new Set(); S.rcbSel = null;
    for (const ied of M.ieds) { S.expanded.add(key({node: ied, fc: null})); for (const ld of ied.children) S.expanded.add(key({node: ld, fc: null})); }
  }
  const errs = M.issues.filter(x => x.level === 'error').length;
  const p = {name, ied: M.ieds.length, ld: M.lds.length, ln: M.lns.length, leaf: fmt(M.leaves.length), ds: M.datasets.length, rcb: M.controls.filter(c => c.tag === 'ReportControl').length};
  setStatus('#icdStatus', () => t('icd.ok', p) + (errs ? t('icd.errs', {n: errs}) : ''), errs ? 'warn' : 'ok');
  rematch(); runAnalysis();
}
$('#fXl').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  busy(true); await nextFrame();
  try { await loadExcelBuffer(f.name, await f.arrayBuffer()); }
  catch (e) { S.wb = null; const m = e.message; setStatus('#xlStatus', () => '✖ ' + m, 'err'); }
  busy(false);
});
async function loadExcelBuffer(name, buf){
  const wb = await Excel.open(buf);
  S.wb = wb; S.xlName = name;
  const sel = $('#selSheet'); sel.innerHTML = wb.sheets.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join('');
  sel.disabled = false; $('#inStart').disabled = false; $('#inPrefix').disabled = false; $('#selCol').disabled = false;
  setStatus('#xlStatus', () => t('xl.ok', {name, fmt: wb.format.toUpperCase(), n: wb.sheets.length}), 'ok');
  await loadSheet(0, true);
}
async function loadSheet(i, guess){
  S.rows = await S.wb.loadSheet(i);
  let maxC = 0; for (const r of S.rows) if (r && r.length > maxC) maxC = r.length;
  // 自動猜測 Tag 欄位：含最多 "." 且無空白的儲存格；若已載入 ICD，優先以 LN 名稱命中數判斷
  let bestC = 0, bestScore = -1, bestRow = 2;
  if (guess) for (let c = 0; c < maxC; c++) {
    let score = 0, firstRow = 0;
    for (let r = 0; r < Math.min(S.rows.length, 400); r++) {
      const v = S.rows[r] && S.rows[r][c]; if (v == null) continue; const s = String(v).trim();
      if (/^[^\s]+\.[^\s]+$/.test(s)) {
        let pts = 1;
        if (S.M && s.split(/[.\/$]/).some(x => S.M.lnIndex.has(x))) pts += 3;
        score += pts; if (!firstRow) firstRow = r + 1;
      }
    }
    if (score > bestScore) { bestScore = score; bestC = c; bestRow = firstRow || 2; }
  }
  const header = c => { for (let r = 0; r < Math.min(S.rows.length, 5); r++) { const v = S.rows[r] && S.rows[r][c]; if (v != null && String(v).trim()) return String(v).trim().slice(0, 30); } return ''; };
  const prevCol = +$('#selCol').value;
  $('#selCol').innerHTML = Array.from({length: Math.max(maxC, 1)}, (_, c) => `<option value="${c}">${colName(c)}${header(c) ? ' : ' + esc(header(c)) : ''}</option>`).join('');
  if (guess) { $('#selCol').value = String(bestC); $('#inStart').value = bestRow; }
  else if (prevCol < maxC) $('#selCol').value = String(prevCol);
  rematch(); runAnalysis();
}

/* ---- Excel 白名單擷取與比對 ---- */
function extractEntries(){
  const out = []; if (!S.rows) return out;
  const col = +$('#selCol').value, start = Math.max(1, +$('#inStart').value || 1), prefix = $('#inPrefix').value.replace(/\s+/g, '');
  const seen = new Map();
  for (let r = start - 1; r < S.rows.length; r++) {
    const v = S.rows[r] && S.rows[r][col]; if (v == null) continue;
    const raw = String(v);
    const norm0 = raw.replace(/[\s ​-‍﻿　]+/g, '');
    if (!norm0) continue;
    const norm = prefix + norm0;
    const e = {row: r + 1, raw, norm, status: '', msg: '', results: [], leafCount: 0};
    if (seen.has(norm)) { e.status = 'duplicate'; e.msg = t('m.dup', {r: seen.get(norm)}); }
    else seen.set(norm, r + 1);
    out.push(e);
  }
  return out;
}
function rematch(){
  const prev = $('#xlPreview');
  if (!S.rows) { prev.textContent = ''; S.entries = []; return; }
  S.entries = extractEntries();
  prev.textContent = S.entries.slice(0, 12).map(e => `${String(e.row).padStart(5)}  ${e.raw}`).join('\n') + (S.entries.length > 12 ? '\n' + t('pv.more', {n: S.entries.length}) : (S.entries.length ? '' : t('pv.none')));
  if (!S.M) return;
  for (const e of S.entries) {
    if (e.status === 'duplicate') continue;
    const r = Matcher.match(S.M, e.norm);
    e.status = r.status; e.msg = r.msg; e.results = r.results;
    e.leafCount = r.results.reduce((a, x) => { let n = 0; for (let i = x.node.leafStart; i < x.node.leafEnd; i++) if (!x.fc || S.M.leaves[i].fc === x.fc) n++; return a + n; }, 0);
    if (r.status === 'matched') {
      const n = r.results[0].node;
      e.msg = n.leaf ? SCL.dotPath(n) : t('m.nonLeaf', {k: n.kind, n: e.leafCount}) + SCL.dotPath(n) + (r.results[0].fc && !n.fc ? ' [' + r.results[0].fc + ']' : '');
    }
  }
}

let runTimer = null;
function runAnalysis(){
  clearTimeout(runTimer);

    $('#btnRun').disabled = !(S.M && S.rows);

}

/* ---- 樹狀圖 ---- */
const key = it => it.kind === 'FC' ? 'F' + it.node.id + '#' + it.fc : it.node.id + '|' + (it.fc || '');
function childrenOf(it){
  const n = it.node;
  if (it.kind === 'FC') return n.children.filter(d => d.fcs && d.fcs.has(it.fc)).map(d => ({node: d, fc: it.fc}));
  if (n.kind === 'IED' || n.kind === 'LD') return n.children.map(c => ({node: c, fc: null}));
  if (n.kind === 'LN') return [...n.fcs].sort().map(fc => ({kind: 'FC', node: n, fc}));
  if (n.kind === 'DO' || n.kind === 'SDO') return n.children.filter(c => c.fcs ? c.fcs.has(it.fc) : c.fc === it.fc).map(c => ({node: c, fc: it.fc}));
  return n.children.map(c => ({node: c, fc: it.fc}));
}
function rangeCounts(it){
  const k = key(it); let c = S.cntCache.get(k); if (c) return c;
  c = [0, 0, 0, 0, 0]; // total, excel, dep, removed, err
  const n = it.node, L = S.M.leaves, st = S.R ? S.R.st : null, fc = it.fc;
  for (let i = n.leafStart; i < n.leafEnd; i++) {
    if (fc && L[i].fc !== fc) continue;
    c[0]++; if (st) { const s = st[i]; if (s === 1) c[1]++; else if (s === 2) c[2]++; else c[3]++; }
    if (L[i].err) c[4]++;
  }
  S.cntCache.set(k, c); return c;
}
function leafVisible(i, mode, q){
  const st = S.R ? S.R.st[i] : -1, L = S.M.leaves[i];
  if (mode === 'kept' && !(st > 0)) return false;
  if (mode === 'excel' && st !== 1) return false;
  if (mode === 'dep' && st !== 2) return false;
  if (mode === 'rem' && st !== 0) return false;
  if (mode === 'err' && !L.err) return false;
  if (q) { if (!L._s) L._s = SCL.dotPath(L).toLowerCase(); if (!L._s.includes(q)) return false; }
  return true;
}
function buildTreeRows(){
  const rows = []; S.treeRows = rows;
  const M = S.M; if (!M) return;
  const mode = $('#treeFilter').value, q = $('#treeSearch').value.trim().toLowerCase();
  const filtering = mode !== 'all' || !!q;
  let ps = null;
  if (filtering) { ps = new Int32Array(M.leaves.length + 1); for (let i = 0; i < M.leaves.length; i++) ps[i + 1] = ps[i] + (leafVisible(i, mode, q) ? 1 : 0); }
  const hasVis = it => {
    if (!filtering) return true;
    const n = it.node;
    if (!it.fc) return ps[n.leafEnd] - ps[n.leafStart] > 0;
    for (let i = n.leafStart; i < n.leafEnd; i++) if (M.leaves[i].fc === it.fc && ps[i + 1] - ps[i]) return true;
    return false;
  };
  const visit = (it, depth) => {
    if (!hasVis(it)) return;
    it.depth = depth; rows.push(it);
    const open = q ? true : S.expanded.has(key(it));
    if (open) for (const c of childrenOf(it)) visit(c, depth + 1);
  };
  for (const ied of M.ieds) visit({node: ied, fc: null}, 0);
  if (filtering && mode === 'err') for (const ln of M.lns) if (ln.err && !rows.some(r => r.node === ln)) rows.push({node: ln, fc: null, depth: 2});
}
function statusClass(it){
  const n = it.node;
  if (n.err && it.kind !== 'FC') return 's-err';
  if (!S.R) return '';
  const c = rangeCounts(it);
  if (c[0] === 0) {
    if (n.kind === 'LN') return S.R.lnKeep.has(n) ? 's-dep' : 's-rem';
    if (n.kind === 'LD') return S.R.ldKeep.has(n) ? 's-dep' : 's-rem';
    return 's-rem';
  }
  if (c[1] > 0) return 's-keep';
  if (c[2] > 0) return 's-dep';
  return 's-rem';
}
function renderTreeRow(i, top){
  const it = S.treeRows[i]; const n = it.node; const isLeaf = it.kind !== 'FC' && n.leaf;
  const kind = it.kind === 'FC' ? 'FC' : n.kind;
  const name = it.kind === 'FC' ? it.fc : n.name;
  const hasKids = !isLeaf && (it.kind === 'FC' || n.children.length > 0 || n.kind === 'LN' && n.fcs.size);
  const open = $('#treeSearch').value.trim() ? true : S.expanded.has(key(it));
  let meta = '';
  if (n.kind === 'LN' && it.kind !== 'FC') meta = n.typeId || '';
  else if ((n.kind === 'DO' || n.kind === 'SDO') && it.kind !== 'FC') meta = (n.cdc ? n.cdc + ' · ' : '') + (n.typeId || '');
  else if (n.kind === 'DA' || n.kind === 'BDA') meta = (n.bType || '') + (n.typeId ? ' · ' + n.typeId : '') + (n.count ? ' [' + n.count + ']' : '');
  else if (n.kind === 'LD') meta = 'inst=' + n.inst;
  if (n.err && it.kind !== 'FC') meta = '⚠ ' + n.err;
  let cnt = '';
  if (it.kind === 'FC' || !isLeaf) {
    const c = rangeCounts(it);
    cnt = S.R ? `<span class="c-keep">✔${c[1]}</span> <span class="c-dep">▲${c[2]}</span> <span class="c-rem">/ ${c[0]}</span>` : esc(t('tr.tags', {n: c[0]}));
  } else if (S.R) {
    const s = S.R.st[n.li]; cnt = s === 1 ? `<span class="c-keep">${t('st.excel')}</span>` : s === 2 ? `<span class="c-dep">${t('st.dep')}</span>` : `<span class="c-rem">${t('st.rem')}</span>`;
  }
  const sel = S.sel && key(S.sel) === key(it) ? ' sel' : '';
  return `<div class="vrow ${statusClass(it)}${isLeaf ? ' leaf' : ''}${sel}" style="top:${top}px;padding-left:${4 + it.depth * 16}px" data-i="${i}">` +
    `<span class="caret" data-c="1">${hasKids ? (open ? '▾' : '▸') : ''}</span><span class="kind k-${kind}">${kind}</span><span class="nm">${esc(name)}</span>` +
    `<span class="meta">${esc(meta)}</span><span class="cnts">${cnt}</span></div>`;
}

function showDetails(it){
  const n = it.node, el = $('#details'); const R = S.R; const sp = t('sep');

  if (n.kind !== 'IED') lines.push(`${t('d.path')}${sp}<code>${esc(SCL.dotPath(n))}</code>　MMS${sp}<code>${esc(SCL.mmsPath(n))}</code>`);
  if (n.err) lines.push(`<span class="c-err">${t('d.err')}${sp}${esc(n.err)}</span>`);

  } else if (R) {

    if (n.kind === 'LN') lines.push(t('d.lnOut') + sp + (R.lnKeep.has(n) ? t('d.keep') : t('d.lnRem')));

const HELP_ZH = `
<h2>使用流程</h2>
<ol>
<li>載入原始 ICD（只讀取，原始檔案不會被修改；所有處理皆在記憶體中的副本進行）。</li>

<h2>Excel 路徑解析規則</h2>
<ul>
<li>以 <code>.</code> 為主要分隔符號；亦接受 <code>/</code>（LDevice 分隔）與 <code>$</code>（MMS 形式）。分隔符號只用來切出名稱，每一段都必須依 ICD 資料模型逐層解析，<b>不是</b>單純字串替換。</li>
<li>不假設固定層數。例如：<code>MMXU1.TotW.mag.f</code>、<code>LD0/MMXU1.TotW.mag.f</code>、<code>IED1LD0/MMXU1$MX$TotW$mag$f</code>、<code>XCBR1.Pos.stVal[ST]</code>、<code>XCBR1.ST.Pos</code>。</li>
<li>前綴可為：無、LDevice inst、LDevice 完整名稱（ldName 或 IED 名稱+inst）、IED 名稱、IED 名稱 + inst。</li>
<li>FC 可省略：DA 的 FC 由 DOType 定義取得。FC 可出現在 LN 之後（MMS 形式）、路徑中任一層一次、或以 <code>[FC]</code> 結尾。指定 FC 與型別定義不符則視為不匹配。</li>
<li>路徑可指到非末端節點（LN、DO、結構 DA），此時保留其下所有 Tag（若有 FC 則僅限該 FC）。</li>
<li>大小寫敏感；空白（含全形空白、NBSP、零寬字元）會被移除；重複項目只計一次。</li>

<li>同一路徑在多個 LDevice/IED 中都能解析時視為 <b>歧義</b>：預設保留所有候選並標黃色，或可設定為不保留。</li>
</ul>

<h2>篩選演算法（Whitelist-based Subtractive Filtering / Mark-and-Sweep）</h2>
<ol>
<li><b>解析</b>：IED → AccessPoint → Server → LDevice → LN0/LN，並依 lnType → LNodeType → DO → DOType → SDO/DA(fc) → DAType → BDA 實例化，Tag = 末端 DA/BDA。</li>
<li><b>Mark</b>：Excel 匹配項目標綠色；再依序加入相依保留（黃色）：控制完整性、q/t（選用）、保留中 Report/GOOSE 的 DataSet 成員、刪減粒度、SCL 結構最小需求。</li>
<li><b>型別計畫</b>：完全保留 → 沿用原型別；同一型別只有一種精簡版本 → 就地精簡並沿用原 id（可關閉）；共用型別有多種不同需求 → 複製為 <code>原id_F1</code>、<code>_F2</code>…，不影響其他使用者。</li>
<li><b>Sweep</b>：移除未保留的 LDevice、LN、ReportControl、DataSet、無效的 DOI/SDI/DAI、失效的 Substation LNode 參照，以及（選用）未被參照的型別。</li>
<li><b>驗證</b>：重新解析輸出並執行結構/參照檢查，與原始 ICD 的既有問題比較；並回讀比對「輸出 ICD 的 Tag 集合」是否等於「預計保留集合」。篩選新增的錯誤會禁止下載。</li>

<h2>ReportControl 選項</h2>
<table>
<tr><th>選項</th><th>行為</th></tr>

<tr><td>保留全部 Report 與 DataSet</td><td>不刪除任何 Report/DataSet；成員全部相依保留。</td></tr>
<tr><td>移除全部 Report</td><td>移除所有 ReportControl 與只被它們使用的 DataSet；DataSet 成員不再相依保留。Elipse 只能以 polling 讀取。</td></tr>

<p>被 GOOSE（GSEControl）、SV、LogControl 使用的 DataSet 一律保留。保留的 DataSet 一律<b>不刪減</b>成員。</p>

<h2>其他設計決策</h2>
<table>
<tr><th>項目</th><th>處理方式</th><th>理由</th></tr>
<tr><td>保留的 DataSet</td><td>不刪減任何 FCDA，成員全部相依保留。</td><td>Report 依 DataSet 成員順序傳送；若 ICD 中的 DataSet 或型別結構與 IED 不同，Client 依 ICD 解碼時可能錯位。</td></tr>
<tr><td>刪減粒度</td><td>預設 DA：保留 <code>mag.f</code> 時整個 <code>mag</code> 保留。</td><td>若 Driver 以 DA/DO 為單位讀取並依 ICD 型別解碼，精簡後的結構可能不一致。確認 Elipse 只讀末端路徑後，可改 Leaf。</td></tr>
<tr><td>控制完整性</td><td>保留任一 CO 屬性時，保留該 DO 的所有 CO 結構及 ctlModel、sboTimeout 等。</td><td>IEC 61850 控制服務需寫入完整 Oper/SBOw 結構；ctlModel 供 Client 判斷 direct / SBO。</td></tr>

<h2>驗證層級（請勿混淆）</h2>
<table>
<tr><th>層級</th><th>本工具</th></tr>

<tr><td>2. SCL 結構與參照有效</td><td>◐ 部分：本工具實作的檢查（型別參照、LN0、名稱唯一、DOI/DAI、FCDA、datSet、GSE/SMV、LNode）。<b>未</b>執行完整 IEC 61850-6 XSD Schema 驗證。</td></tr>

<h2>已知限制</h2>
<ul>
<li><b>Tag 數只計資料型別展開的末端 DA/BDA。</b>Elipse 另外會依控制區塊建立節點（ReportControl → RP/BR、SettingControl → SP、GSEControl → GO、LogControl → LG），這些不在樹狀圖與 Tag 數中。</li>
<li>陣列（count）視為單一 Tag；Elipse 可能依元素展開。</li>
<li>精簡後的 ICD 不再與 IED 實際模型完全一致，只供 Elipse 使用，不可用於系統整合（SCD）。</li>
<li>不修改 Communication 區段；不處理 ed2.1 的擴充語意（例如 count 參照其他屬性）。</li>
<li>.xls 僅支援 Excel 97–2003（BIFF8）且未加密；Excel 公式只讀取快取結果值。</li>
</ul>

<h2>SCL 函式庫評估</h2>
<p>OpenEnergyTools <code>scl-lib</code> / OpenSCD 模組以 TypeScript ES Module 發佈，主要提供 SCL 編輯操作，未提供「依型別實例化為 Tag 清單並依白名單反向精簡/複製型別」功能，且需要 Node.js 建置。因此本工具以 DOMParser 作為 XML 讀取層，自行實作 IEC 61850-6 資料模型與相依處理，並以回讀比對確認輸出。</p>

<h2>Phase 3 Elipse 驗收清單</h2>

<li>確認授權計數的 Tag 數符合預期。</li>
</ol>`;

const HELP_EN = `
<h2>Workflow</h2>
<ol>
<li>Load the original ICD (read only; the original file is never modified; all processing works on an in-memory copy).</li>
<li>Load the Excel I/O list and select the worksheet, tag column and first data row (the tool guesses them; please confirm).</li>
<li>Review "Excel match results" and resolve every <b>Not found</b> and <b>Ambiguous</b> entry.</li>
<li>Choose which Reports to keep with the "ReportControl" option, and review "Dependencies" to see why non-whitelisted tags are kept.</li>
<li>Make sure "Validation & warnings" shows no new errors, download the filtered ICD, then run the Phase 3 tests in Elipse.</li>
</ol>

<h2>Excel path resolution rules</h2>
<ul>
<li><code>.</code> is the main separator; <code>/</code> (LDevice) and <code>$</code> (MMS style) are also accepted. Separators only split names; every segment is resolved level by level against the ICD data model — this is <b>not</b> a plain string replacement.</li>
<li>No fixed depth is assumed. Examples: <code>MMXU1.TotW.mag.f</code>, <code>LD0/MMXU1.TotW.mag.f</code>, <code>IED1LD0/MMXU1$MX$TotW$mag$f</code>, <code>XCBR1.Pos.stVal[ST]</code>, <code>XCBR1.ST.Pos</code>.</li>
<li>Allowed prefixes: none, LDevice inst, full LDevice name (ldName or IED name + inst), IED name, IED name + inst.</li>
<li>The FC is optional: a DA's FC comes from its DOType. The FC may follow the LN (MMS style), appear once at any level, or be given as a trailing <code>[FC]</code>. A FC that contradicts the type definition is a mismatch.</li>
<li>A path may point to a non-leaf node (LN, DO, struct DA); all tags below it are kept (restricted to the FC if one is given).</li>
<li>Case-sensitive; whitespace (incl. full-width spaces, NBSP, zero-width characters) is removed; duplicates count once.</li>
<li>Near matches such as different letter case are shown as hints only and <b>never</b> decide what is kept or removed.</li>
<li>A path that resolves in several LDevices/IEDs is <b>ambiguous</b>: by default all candidates are kept and marked yellow; this can be changed to keep none.</li>
</ul>

<h2>Filtering algorithm (whitelist-based subtractive filtering / mark-and-sweep)</h2>
<ol>
<li><b>Parse</b>: IED → AccessPoint → Server → LDevice → LN0/LN, instantiated via lnType → LNodeType → DO → DOType → SDO/DA(fc) → DAType → BDA. A tag = a leaf DA/BDA.</li>
<li><b>Mark</b>: Excel matches are green; dependencies (yellow) are then added: control completeness, q/t (optional), DataSet members of kept Reports/GOOSE, granularity, SCL structural minimum.</li>
<li><b>Type plan</b>: fully kept → original type; only one reduced variant → reduced in place keeping the original id (can be disabled); a shared type needed in different ways → cloned as <code>id_F1</code>, <code>_F2</code>… without affecting other users.</li>
<li><b>Sweep</b>: removes LDevices, LNs, ReportControls and DataSets that are not kept, invalid DOI/SDI/DAI, broken Substation LNode references and (optionally) unreferenced types.</li>
<li><b>Validate</b>: re-parses the output, runs the structure/reference checks and compares them with issues already present in the original ICD; then checks that the tag set read back from the output equals the planned set. New errors block the download.</li>
</ol>

<h2>ReportControl option</h2>
<table>
<tr><th>Option</th><th>Behaviour</th></tr>
<tr><td>Keep Reports containing whitelisted data (default)</td><td>A Report is kept if its DataSet contains any whitelisted data; all members of that DataSet are kept as dependencies (yellow).</td></tr>
<tr><td>Keep all Reports and DataSets</td><td>No Report/DataSet is removed; all members are kept as dependencies.</td></tr>
<tr><td>Remove all Reports</td><td>Removes every ReportControl and the DataSets used only by them; their members are no longer kept as dependencies. Elipse can only poll.</td></tr>
<tr><td>Custom</td><td>Tick the Reports to keep in the list. On first switch, Reports containing whitelisted data are pre-ticked.</td></tr>
</table>
<p>DataSets used by GOOSE (GSEControl), SV or LogControl are always kept. Members of a kept DataSet are <b>never</b> trimmed.</p>
<p><b>Risks of removing Reports</b>: with polling only, short changes between two reads (e.g. protection trip pulses) can be missed, status updates are delayed and IED-side event timestamps are lost; BRCB buffering during disconnection is lost; polling may also increase IED and network load. Keeping Reports for event data (protection, switch positions) and polling measurements is a common compromise.</p>

<h2>Other design decisions</h2>
<table>
<tr><th>Item</th><th>Handling</th><th>Reason</th></tr>
<tr><td>Kept DataSets</td><td>No FCDA is removed; all members are kept as dependencies.</td><td>Reports are sent in DataSet member order; if the DataSet or type structure in the ICD differs from the IED, a client decoding by the ICD may misalign values.</td></tr>
<tr><td>Granularity</td><td>Default DA: keeping <code>mag.f</code> keeps the whole <code>mag</code>.</td><td>If the driver reads whole DAs/DOs and decodes them by the ICD types, reduced structures may not match. Switch to Leaf once Elipse is confirmed to read leaf paths only.</td></tr>
<tr><td>Control completeness</td><td>When any CO attribute is kept, all CO structures of that DO plus ctlModel, sboTimeout etc. are kept.</td><td>IEC 61850 control services write the complete Oper/SBOw structure; ctlModel tells the client whether to use direct or SBO.</td></tr>
<tr><td>LN0</td><td>A kept LDevice always keeps LN0; with no whitelisted data, a minimum (Mod.stVal) is kept.</td><td>The SCL schema requires LN0 in an LDevice and at least one DO in an LNodeType.</td></tr>
<tr><td>GOOSE / SV</td><td>Never removed automatically.</td><td>They may be subscribed by other IEDs and are referenced by the Communication section.</td></tr>
<tr><td>SettingControl</td><td>Kept by default; removed only when "Remove SettingControl" is ticked.</td><td>Elipse creates the SP node in LLN0 from SettingControl. After removal, setting groups cannot be switched/read from Elipse; the IED itself is unaffected.</td></tr>
</table>

<h2>Validation levels (do not confuse them)</h2>
<table>
<tr><th>Level</th><th>This tool</th></tr>
<tr><td>1. Well-formed XML</td><td>✔ checked</td></tr>
<tr><td>2. Valid SCL structure and references</td><td>◐ partially: checks implemented by this tool (type references, LN0, unique names, DOI/DAI, FCDA, datSet, GSE/SMV, LNode). Full IEC 61850-6 XSD schema validation is <b>not</b> performed.</td></tr>
<tr><td>3. Importable by the Elipse DLL</td><td>✖ must be tested in Elipse (Phase 3)</td></tr>
<tr><td>4. Working IED communication</td><td>✖ must be tested on site / with the real device (Phase 3)</td></tr>
</table>

<h2>Known limitations</h2>
<ul>
<li><b>Tag counts only include leaf DA/BDA expanded from data types.</b> Elipse also creates nodes from control blocks (ReportControl → RP/BR, SettingControl → SP, GSEControl → GO, LogControl → LG); these are not in the tree or the tag count.</li>
<li>Arrays (count) are counted as one tag; Elipse may expand them per element.</li>
<li>The filtered ICD no longer matches the real IED model exactly; use it for Elipse only, never for system integration (SCD).</li>
<li>The Communication section is not modified; Edition 2.1 extensions (e.g. count referencing another attribute) are not interpreted.</li>
<li>.xls supports unencrypted Excel 97–2003 (BIFF8) only; Excel formulas use their cached result values.</li>
</ul>

<h2>SCL library evaluation</h2>
<p>OpenEnergyTools <code>scl-lib</code> / OpenSCD modules are TypeScript ES modules focused on SCL editing operations; they do not instantiate types into a tag list or reduce/clone types from a whitelist, and they need a Node.js build. This tool therefore uses DOMParser as the XML layer and implements the IEC 61850-6 data model and dependency handling itself, confirming the output with a read-back comparison.</p>

<h2>Phase 3 Elipse acceptance checklist</h2>
<ol>
<li>Import the original and the filtered ICD into Elipse, record the driver tag counts and explain differences from "Tags read back from output ICD" (including RP/BR/SP nodes).</li>
<li>Compare the Elipse tag list with the KEEP rows of the tag status CSV.</li>
<li>Verify polling reads, controls (direct/SBO) and Reports (buffered/unbuffered); when Reports are removed, check specifically for missed events.</li>
<li>Verify that the licence-counted tag count is as expected.</li>
</ol>`;
